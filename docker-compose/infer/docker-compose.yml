services:
    # cpus/mem_limit not set because Infer is intended to be a foreground container.
    infer:
        build: infer
        image: infer
        container_name: infer
        environment:
            - TZ=Asia/Hong_Kong
        volumes:
            - type: bind
              source: ../..
              target: /mnt
              read_only: true
            - type: volume
              source: gradle_cache
              target: /root/.gradle
              volume:
                  nocopy: true
        stdin_open: true
        tty: true
        restart: "unless-stopped"
        command: /bin/bash -c 'rm -rf /root/project || true; cp -r /mnt /root/project; cd /root/project; exec /bin/bash'

volumes:
    gradle_cache:
        driver: local
